name: Key Diaria
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar key
        id: k
        run: echo "KEY=BLOX-$(tr -dc A-Z0-9 </dev/urandom | head -c5)" >> $GITHUB_OUTPUT
      - name: Criar pagina
        run: |
          echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Key</title><style>body{background:#0a0a0f;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#14141f;padding:40px;border-radius:12px;text-align:center}h1{margin-bottom:10px}.key{background:#000;padding:12px;margin:20px 0;font-family:monospace;border-radius:6px}button{padding:10px 20px;background:#fff;color:#000;border:none;border-radius:6px;font-weight:bold}</style></head><body><div class="box"><h1>Successfully whitelisted!</h1><p>Volte ao script em 24h</p><div class="key">${{ steps.k.outputs.KEY }}</div><button onclick="navigator.clipboard.writeText(`${{ steps.k.outputs.KEY }}`)">Copy</button></div></body></html>' > index.html
      - name: Salvar
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add index.html
          git commit -m "${{ steps.k.outputs.KEY }}" || true
          git push
